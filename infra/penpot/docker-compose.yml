services:
  penpot-frontend:
    image: penpotapp/frontend:latest
    container_name: penpot-frontend
    restart: unless-stopped
    depends_on:
      penpot-backend:
        condition: service_healthy
      penpot-exporter:
        condition: service_started
    environment:
      PENPOT_FLAGS: ${PENPOT_FLAGS:-enable-registration enable-smtp enable-prepl-server}
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI}
      PENPOT_HTTP_SERVER_HOST: 0.0.0.0
      PENPOT_HTTP_SERVER_PORT: 8080
    networks:
      - penpot

  penpot-backend:
    image: penpotapp/backend:latest
    container_name: penpot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: ${PENPOT_FLAGS:-enable-registration enable-smtp enable-prepl-server}
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI}
      PENPOT_DATABASE_URI: postgresql://postgres/${POSTGRES_DB}
      PENPOT_DATABASE_USERNAME: ${POSTGRES_USER}
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PENPOT_REDIS_URI: redis://redis:6379/0
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-false}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_MCP_KEY: 
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-true}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}
    volumes:
      - penpot_assets:/opt/data/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6060/readyz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - penpot

  penpot-exporter:
    image: penpotapp/exporter:latest
    container_name: penpot-exporter
    restart: unless-stopped
    environment:
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_REDIS_URI: redis://redis:6379/0
    networks:
      - penpot

  postgres:
    image: postgres:16-alpine
    container_name: penpot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - penpot

  redis:
    image: redis:7-alpine
    container_name: penpot-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - penpot

  nginx:
    image: nginx:1.27-alpine
    container_name: penpot-nginx
    restart: unless-stopped
    depends_on:
      - penpot-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    networks:
      - penpot

volumes:
  penpot_assets:
  postgres_data:
  redis_data:

networks:
  penpot:
    driver: bridge
